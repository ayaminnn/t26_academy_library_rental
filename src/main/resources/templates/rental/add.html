<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{common :: meta_header('貸出登録',~{::link},~{::script})}">
    <title th:text="${title}+' | MTLibrary'"></title>
    <link rel="stylesheet" th:href="@{/css/rental/add.css}" />
</head>

<body>
    <div class="contents">
        <div th:replace="~{common :: main_sidebar}"></div>
        <div class="main_contents">
            <div th:replace="~{common :: header}"></div>
            <div class="inner_contens">
                <div class="page_title">貸出登録</div>
                <div class="mb30 flexarea">
                    <span class="text-red">＊は必須項目です</span>
                    <span>
                        <a th:href="@{/rental/index}" class="link">← 一覧へ戻る</a>
                    </span>
                </div>
                <form id="rental_add_form" th:action="@{/rental/add}" th:object="${rentalManageDto}" method="post">
                    <div class="mb30">
                        <label class="input_title" for="employeeId">社員番号<span class="text-red asterisk">＊</span></label>
                        <select id="employeeId" class="form_input" th:field="*{employeeId}">
                            <option value="">社員番号を選択</option>
                            <option th:each="account : ${accounts}" th:value="${account.employeeId}"
                                th:text="${account.employeeId + ' ' + account.name}"></option>
                        </select>
                        <div th:errors="*{employeeId}" style="color:red;"></div>
                    </div>
                    <div class="mb30">
                        <label class="input_title" for="expectedRentalOn">貸出予定日<span
                                class="text-red asterisk">＊</span></label>
                        <input type="date" id="expectedRentalOn" class="form_input" th:field="*{expectedRentalOn}">
                        <div th:errors="*{expectedRentalOn}" style="color:red;"></div>
                    </div>
                    <div class="mb30">
                        <label class="input_title" for="expectedReturnOn">返却予定日<span
                                class="text-red asterisk">＊</span></label>
                        <input type="date" id="expectedReturnOn" class="form_input" th:field="*{expectedReturnOn}">
                        <div th:errors="*{expectedReturnOn}" style="color:red;"></div>
                    </div>
                    <div class="mb30">
                        <label class="input_title" for="stockMngNumber">在庫管理番号<span
                                class="text-red asterisk">＊</span></label>
                        <select id="stockMngNumber" class="form_input" th:field="*{stockId}">
                            <option value="">在庫管理番号を選択</option>
                            <option th:each="stock : ${stockList}" th:value="${stock.id}"
                                th:text="${stock.id + ' ' + stock.bookMst.title}"></option>
                        </select>
                        <div th:errors="*{stockId}" style="color:red;"></div>
                    </div>
                    <div class="mb30">
                        <label class="input_title" for="rentalStatus">貸出ステータス<span
                                class="text-red asterisk">＊</span></label>
                        <select id="rentalStatus" class="form_input" th:field="*{status}">
                            <option value="">ステータスを選択</option>
                            <option th:each="status : ${rentalStatus}" th:value="${status.value}"
                                th:text="${status.text}"></option>
                        </select>
                        <div th:errors="*{status}" style="color:red;"></div>
                    </div>
                    <div class="btn_block">
                        <button type="submit" id="submit_btn">保存</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <div th:replace="~{common :: footer}"></div>
</body>
